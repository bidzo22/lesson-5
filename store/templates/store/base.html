{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/global.css' %}">
    <link rel="stylesheet" href="{% static 'css/product_card.css' %}">  <!-- Додаємо CSS для карток -->
    <title>{% block title %}MyStore{% endblock %}</title>
    {% block extra_css %}{% endblock %}
</head>
<body> 
<header>
    <h2>MyShop</h2>

    <form method="GET" class="search-bar" action="{% url 'store:search' %}">
        <input type="text" name="q" value="{{ query }}" placeholder="Введіть назву товару...">
        <button type="submit" class="btn btn-primary">Знайти</button>
    </form>

    <nav>
    <a href="/">Головна</a>
    <a href="{% url 'store:product_list' %}">Каталог</a>
    <a href="{% url 'store:order_list' %}">Замовлення</a>
    <a href="/contacts/">Контакти</a> 
</nav>
</header>
<main>
    {% block content %}{% endblock %}
</main>
<footer>© 2024 MyShop — навчальний проект Django</footer>
<script src="{% static 'js/script.js' %}"></script>
{% block extra_js %}{% endblock %}
</body>
</html>
